services:
  ai-service:
    build:
      context: ./ai-engine
    container_name: falci-ai-engine
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
    networks:
      - falci-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  gateway-service:
    build:
      context: ./gateway
    container_name: falci-gateway
    ports:
      - "39842:8000"
    environment:
      - AI_SERVICE_URL=http://falci-ai-engine:8000/predict
    volumes:
      - shared-audio:/shared/audio
    networks:
      - falci-net
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  falci-net:
    driver: bridge

volumes:
  shared-audio:
