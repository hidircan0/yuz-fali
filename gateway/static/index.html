<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistik Falcı - Gateway</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0c0d14; color: #e2e8f0; display: flex; justify-content: center; padding: 30px 15px; }
        .wrapper { width: 100%; max-width: 580px; text-align: center; }
        h1 { font-size: 1.6rem; margin-bottom: 20px; color: #d946ef; letter-spacing: -0.5px; }
        .video-box { position: relative; border-radius: 12px; overflow: hidden; background: #181926; border: 1px solid #2d2f45; aspect-ratio: 4/3; }
        video { width: 100%; height: 100%; object-fit: cover; }
        button { margin-top: 18px; width: 100%; padding: 14px; border-radius: 8px; border: none; background: #a855f7; color: white; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s ease; }
        button:hover { background: #9333ea; }
        button:disabled { background: #3b3d54; cursor: not-allowed; opacity: 0.7; }
        .status { margin-top: 15px; font-size: 0.95rem; min-height: 24px; color: #a855f7; }
        .output { margin-top: 20px; text-align: left; background: #141522; padding: 20px; border-radius: 10px; border: 1px solid #282a3e; line-height: 1.7; font-size: 0.95rem; white-space: pre-wrap; min-height: 80px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Mistik Yüz Falcısı</h1>
        <div class="video-box">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
        <button id="action-btn" onclick="captureAndSend()">Falıma Bak</button>
        <div id="status-bar" class="status"></div>
        <div id="result-box" class="output">Kameraya dik bak ve butona tıkla...</div>
        
        <audio id="tts-player" style="display: none;"></audio>
        <canvas id="snapshot" style="display: none;"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('snapshot');
        const btn = document.getElementById('action-btn');
        const statusEl = document.getElementById('status-bar');
        const resultEl = document.getElementById('result-box');
        const audio = document.getElementById('tts-player');

        // Tarayıcıdan kamerayı başlat
        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { resultEl.innerText = "Kamera erişim izni verilmedi: " + err.message; });

        async function captureAndSend() {
            btn.disabled = true;
            statusEl.innerText = "Falcı auranı inceliyor, lütfen bekle...";
            resultEl.innerText = "";

            // Kareyi al
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // JPEG Base64'e çevir
            const base64Data = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

            try {
                const response = await fetch('/api/v1/fortune', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_base64: base64Data })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Sunucu hatası.");

                statusEl.innerText = "";
                resultEl.innerText = data.reading;

                if (data.audio_url) {
                    audio.src = data.audio_url + '?t=' + Date.now();
                    audio.play();
                }
            } catch (err) {
                statusEl.innerText = "";
                resultEl.innerText = "Hata: " + err.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
